# Alembic configuration for the trading bot.
#
# The database URL is NOT stored here. env.py loads it from tradingbot.config
# (which reads the gitignored .env), so no secret ever lands in a tracked file.

[alembic]
script_location = src/tradingbot/db/migrations
prepend_sys_path = src
path_separator = os
# Timestamped, slugged revision filenames, e.g. 2026_09_30_1650-<rev>_initial_schema.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
