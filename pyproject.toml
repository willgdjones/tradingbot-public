[project]
name = "tradingbot"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "alpaca-py>=0.44.0",
    "cryptography>=50.0.2",
    "hmmlearn>=0.3.3",
    "httpx>=0.28.1",
    "kalshi-python>=2.1.4",
    "polymarket-client>=0.11.0",
    "polymarket-us>=2.1.0",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.1.1",
    "typesafe-sdk>=0.7.2",
]

[project.scripts]
tradingbot = "tradingbot:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
